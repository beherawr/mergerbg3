# Auto-build the Windows .exe on every version tag and publish a GitHub
# Release with the exe attached. Triggers on tags matching ``v*.*.*``
# (e.g. v0.1.0, v1.2.3).
#
# Usage:
#     git tag v0.1.0
#     git push origin v0.1.0
#
# A few minutes later your release appears at:
#     https://github.com/<you>/<repo>/releases/latest
# with bg3_mod_merger.exe attached. Share that URL.

name: Build and release Windows exe

on:
  push:
    tags:
      - 'v*.*.*'
  # Also allow manual triggering from the Actions tab.
  workflow_dispatch: {}

permissions:
  # Required to create a release and upload assets.
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 lxml pytest

      # NOTE: no `pytest tests/` step here.
      # The test suite depends on private fixture mods that are NOT
      # checked into the public repo (they're real shared community
      # mods). CI would always fail at fixture-loading time. Tests are
      # run locally before each release tag is pushed; treat a green
      # local run as the precondition for tagging a release.

      - name: Derive version string from tag
        id: version
        run: |
          # Strip leading "refs/tags/v" → "0.1.0"; default to 0.0.0 on a
          # manual workflow_dispatch run that has no tag.
          $ref = "${{ github.ref }}"
          if ($ref -like "refs/tags/v*") {
            $version = $ref -replace "refs/tags/v", ""
          } else {
            $version = "0.0.0"
          }
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Building version $version"
        shell: pwsh

      - name: Generate Windows version_info.txt
        # PyInstaller embeds this so SmartScreen treats the exe as a
        # proper signed-looking app (well, less suspicious: actual
        # SmartScreen reputation still requires real code signing).
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $parts = $v.Split('.')
          while ($parts.Count -lt 4) { $parts += "0" }
          $tuple = ($parts[0..3] -join ", ")
          $content = @"
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=($tuple),
              prodvers=($tuple),
              mask=0x3f,
              flags=0x0,
              OS=0x40004,
              fileType=0x1,
              subtype=0x0,
              date=(0, 0)),
            kids=[
              StringFileInfo(
                [StringTable(u'040904B0', [
                  StringStruct(u'CompanyName', u'BG3 Mod Merger'),
                  StringStruct(u'FileDescription', u'BG3 Mod Merger'),
                  StringStruct(u'FileVersion', u'$v'),
                  StringStruct(u'InternalName', u'bg3_mod_merger'),
                  StringStruct(u'OriginalFilename', u'bg3_mod_merger.exe'),
                  StringStruct(u'ProductName', u'BG3 Mod Merger'),
                  StringStruct(u'ProductVersion', u'$v'),
                ])]),
              VarFileInfo([VarStruct(u'Translation', [1033, 1200])])
            ]
          )
          "@
          Set-Content -Path version_info.txt -Value $content -Encoding utf8
        shell: pwsh

      - name: Build the exe
        run: |
          pyinstaller bg3_mod_merger.spec --clean --noconfirm
        shell: pwsh

      - name: Rename exe to include version
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Move-Item -Path "dist\bg3_mod_merger.exe" -Destination "dist\bg3_mod_merger-$v.exe"
        shell: pwsh

      - name: Upload the exe as an artifact
        # Always upload, even on manual runs without a tag. The release
        # step below only fires for tag pushes.
        uses: actions/upload-artifact@v4
        with:
          name: bg3_mod_merger-${{ steps.version.outputs.version }}
          path: dist/bg3_mod_merger-*.exe
          retention-days: 30

      - name: Create GitHub Release with the exe attached
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/bg3_mod_merger-*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
